function saveName() {
    const name = document.getElementById("name").value.trim();

    if (name === "") {
        alert("Please enter your name first 💗");
        return;
    }

    fetch(scriptURL, {
        method: "POST",
        body: new URLSearchParams({
            name: name
        })
    })
    .then(() => {
        window.location.href = "flower.html";
    })
    .catch(error => {
        console.error(error);
        alert("Something went wrong. Please try again.");
    });
}
